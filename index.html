<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Link in Bio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            width: 90%;
            max-width: 400px;
            padding: 20px;
        }
        .profile-pic {
            border-radius: 50%;
            width: 100px;
            height: 100px;
            background-color: #333;
            margin: 0 auto 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }
        .link-btn {
            display: block;
            background-color: #1f1f1f;
            color: white;
            text-decoration: none;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            font-weight: bold;
            border: 1px solid #333;
            transition: background 0.3s;
        }
        .link-btn:hover {
            background-color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-pic">👋</div>
        <h1>@shrondajeanine79</h1>
        <p>Welcome to my custom link in bio page!</p>
        <div class="links">
            <a href="https://github.com/shrondajeanine79-gif" class="link-btn" target="_blank">GitHub Profile</a>
            <a href="https://google.com" class="link-btn" target="_blank">My Personal Space</a>
        </div>
    </div>
</body>
</html>
