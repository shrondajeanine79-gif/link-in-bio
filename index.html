<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>On Purpose With Purpose</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 30%, #311042 70%, #020617 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 0;
            overflow-x: hidden;
        }

        /* Ambient glass background glow accents */
        .bg-glow-1, .bg-glow-2 {
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            z-index: 1;
            filter: blur(90px);
            opacity: 0.35;
        }
        .bg-glow-1 { background: #ca8a04; top: 10%; left: 15%; } 
        .bg-glow-2 { background: #db2777; bottom: 10%; right: 15%; }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 90%;
            max-width: 400px;
            padding: 35px 25px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.4);
        }

        .profile-pic {
            border-radius: 50%;
            width: 100px;
            height: 100px;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
            margin: 0 auto 20px auto;
            display: block;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 1.6rem;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .bio {
            color: rgba(255, 255, 255, 0.65);
            font-size: 0.95rem;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-btn {
            display: block;
            color: #ffffff;
            text-decoration: none;
            padding: 15px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.2px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        /* Personalized Branded Hover Glow Styles */
        .youtube-btn:hover {
            background: rgba(255, 0, 0, 0.2) !important;
            border-color: rgba(255, 0, 0, 0.4) !important;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.25);
        }

        .facebook-btn:hover {
            background: rgba(24, 119, 242, 0.2) !important;
            border-color: rgba(24, 119, 242, 0.4) !important;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(24, 119, 242, 0.25);
        }

        .linkedin-btn:hover {
            background: rgba(10, 102, 194, 0.2) !important;
            border-color: rgba(10, 102, 194, 0.4) !important;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(10, 102, 194, 0.25);
        }

        .instagram-btn:hover {
            background: rgba(225, 48, 108, 0.2) !important;
            border-color: rgba(225, 48, 108, 0.4) !important;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(225, 48, 108, 0.25);
        }

        .tiktok-btn:hover {
            background: rgba(0, 242, 234, 0.15) !important;
            border-color: rgba(254, 44, 85, 0.4) !important;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 242, 234, 0.2);
        }

        .email-btn:hover {
            background: rgba(16, 185, 129, 0.2) !important;
            border-color: rgba(16, 185, 129, 0.4) !important;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.25);
        }

        .github-btn:hover {
            background: rgba(255, 255, 255, 0.15) !important;
            border-color: rgba(255, 255, 255, 0.25) !important;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <div class="container">
        <!-- Renders your live GitHub avatar profile photo -->
        <img src="https://github.com" alt="Profile Picture" class="profile-pic">
        
        <h1>On Purpose With Purpose</h1>
        <p class="bio">Welcome to my space! Connect with my content and official channels below.</p>
        
        <div class="links-container">
            <!-- 1. YouTube Link -->
            <a href="https://youtube.com" class="link-btn youtube-btn" target="_blank">📺 YouTube Channel</a>
            
            <!-- 2. Facebook Link -->
            <a href="https://facebook.com" class="link-btn facebook-btn" target="_blank">📘 Facebook Connection</a>
            
            <!-- 3. LinkedIn Link -->
            <a href="https://www.linkedin.com/in/shronda-/" class="link-btn linkedin-btn" target="_blank">💼 LinkedIn Profile</a>
            
            <!-- 4. Instagram Link -->
            <a href="https://instagram.com" class="link-btn instagram-btn" target="_blank">📸 Instagram Feed</a>
            
            <!-- 5. TikTok Link -->
            <a href="https://tiktok.com" class="link-btn tiktok-btn" target="_blank">🎵 TikTok Videos</a>
            
            <!-- 6. Direct Email Connection Button -->
            <a href="mailto:shronda779@gmail.com" class="link-btn email-btn">✉️ Contact Me Directly</a>
            
            <!-- 7. GitHub Link -->
            <a href="https://github.com" class="link-btn github-btn" target="_blank">💻 GitHub Code Archive</a>
        </div>
    </div>
</body>
</html>
